; SPDX-License-Identifier: MIT
; lynx — firmware for the lynx pan/tilt camera (Seeed XIAO ESP32-S3 Sense):
; servos, camera, and the LAN control layer (REST API, MCP, MJPEG stream, setup portal).

[platformio]
default_envs = xiao

[env:xiao]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = post:tools/merge_bin.py
; 8 MB flash, 8 MB octal PSRAM (camera frame buffers live there)
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  ; Edge Impulse custom models (lib/lynx_model, optional): use Espressif's accelerated ESP-NN kernels
  -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=1
lib_deps =
  madhephaestus/ESP32Servo@3.0.6
  bblanchon/ArduinoJson@7.2.1
test_ignore = *

[env:native]
platform = native
test_framework = unity
lib_deps =
  bblanchon/ArduinoJson@7.2.1
build_flags = -std=c++17 -Wall -Wextra
