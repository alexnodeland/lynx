name: Home Assistant
on:
  push:
    branches: [main]
    paths: ["custom_components/**", "tests/hass/**", "hacs.json", "pyproject.toml", "ruff.toml", ".github/workflows/hass.yml"]
  pull_request:
    paths: ["custom_components/**", "tests/hass/**", "hacs.json", "pyproject.toml", "ruff.toml", ".github/workflows/hass.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brand images ship in custom_components/lynx/brand (HA 2026.3+). license: the repo is
          # triple-licensed per folder (LICENSES/, SPDX headers), which GitHub can't show as one licence
          ignore: license
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install pytest-homeassistant-custom-component==0.13.373 PyTurboJPEG==1.8.3 zeroconf==0.151.5 ruff==0.17.1
      - run: ruff check custom_components tests && ruff format --check custom_components tests
      - run: pytest
