name: Lint
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # the firmware-test hook needs the toolchain; firmware.yml runs those, so skip it here
      - run: pip install pre-commit==4.3.0
      - run: SKIP=firmware-native-tests pre-commit run --all-files --show-diff-on-failure
