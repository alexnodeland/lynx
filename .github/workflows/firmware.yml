name: Firmware
on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:
permissions:
  contents: write   # release assets on tags
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/lynx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/lynx/platformio.ini') }}
      - run: pip install platformio==6.1.18
      - name: Native tests (motion, MCP, auth)
        run: pio test -e native
      - name: Build for the XIAO ESP32-S3 Sense
        run: pio run -e xiao
      - uses: actions/upload-artifact@v4
        with:
          name: lynx-firmware
          path: |
            firmware/lynx/.pio/build/xiao/lynx.bin
            firmware/lynx/.pio/build/xiao/firmware.bin
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .pio/build/xiao/lynx.bin "lynx-${GITHUB_REF_NAME}.bin"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "lynx-${GITHUB_REF_NAME}.bin" --clobber
