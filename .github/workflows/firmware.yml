name: Firmware
on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:
permissions:
  contents: write   # release assets on tags
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/lynx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/lynx/platformio.ini') }}
      - run: pip install platformio==6.1.18
      - name: Native tests (motion, MCP, auth)
        run: pio test -e native
      - name: Build for the XIAO ESP32-S3 Sense
        run: pio run -e xiao
      - uses: actions/upload-artifact@v4
        with:
          name: lynx-firmware
          path: |
            firmware/lynx/.pio/build/xiao/lynx.bin
            firmware/lynx/.pio/build/xiao/firmware.bin
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # lynx-vX.bin: the merged image, flashed at 0x0 over USB (web flasher, esptool)
        # lynx-app-vX.bin: the app alone, for over-the-air updates (dashboard, Home Assistant, curl)
        # lynx-vX.json: version + SHA-256 of both, which Home Assistant checks before it flashes
        run: |
          v="${GITHUB_REF_NAME}"
          cp .pio/build/xiao/lynx.bin "lynx-${v}.bin"
          cp .pio/build/xiao/firmware.bin "lynx-app-${v}.bin"
          python3 - "$v" <<'PY'
          import hashlib, json, sys
          v = sys.argv[1]
          h = lambda f: hashlib.sha256(open(f, "rb").read()).hexdigest()
          json.dump({"version": v.lstrip("v"), "chip": "esp32s3",
                     "app": {"file": f"lynx-app-{v}.bin", "sha256": h(f"lynx-app-{v}.bin")},
                     "merged": {"file": f"lynx-{v}.bin", "sha256": h(f"lynx-{v}.bin"), "offset": 0}},
                    open(f"lynx-{v}.json", "w"), indent=2)
          PY
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --generate-notes
          gh release upload "$v" "lynx-${v}.bin" "lynx-app-${v}.bin" "lynx-${v}.json" --clobber
  custom-model:
    # proves the Edge Impulse adapter (src/detect_ei.cpp) still builds against a real export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/lynx/platformio.ini') }}
      - uses: extractions/setup-just@v2
      - run: pip install platformio==6.1.18
      - name: Seeed's public Edge Impulse export for the XIAO ESP32-S3
        run: curl -fsSL -o /tmp/ei.zip https://files.seeedstudio.com/wiki/tinyml-topic/res/xiao-esp32s3-fruits-classify_inferencing.zip
      - run: just model-add /tmp/ei.zip
      - run: pio run -e xiao
        working-directory: firmware/lynx
