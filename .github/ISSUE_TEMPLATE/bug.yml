name: Bug
description: Something in the firmware, Home Assistant integration or website doesn't work
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [firmware, Home Assistant integration, MCP, website / build guide / flasher, other]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
  - type: input
    id: version
    attributes:
      label: Firmware version
      description: from `info` on the serial console, or GET /api/info
      placeholder: "0.3.0"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: serial output (`just fw-monitor`), HA logs, or the browser console. Redact the token.
      render: text
