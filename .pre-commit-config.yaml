# `just setup` installs these; `just lint` runs them over everything.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(stl|step|svg)$
      - id: end-of-file-fixer
        exclude: \.(stl|step|svg|json)$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=4000]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        files: ^(custom_components|tests)/
      - id: ruff-format
        files: ^(custom_components|tests)/
  - repo: local
    hooks:
      - id: firmware-native-tests
        name: firmware native tests (motion, MCP, auth, netplan)
        entry: bash -c 'cd firmware/lynx && ../../.venv/bin/pio test -e native'
        language: system
        files: ^firmware/lynx/(lib|test|src)/
        pass_filenames: false
      - id: hass-translations-in-sync
        name: strings.json == translations/en.json
        entry: cmp custom_components/lynx/strings.json custom_components/lynx/translations/en.json
        language: system
        files: ^custom_components/lynx/(strings\.json|translations/)
        pass_filenames: false
