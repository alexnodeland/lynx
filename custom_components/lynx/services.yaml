look:
  target:
    entity:
      integration: lynx
      domain: camera
  fields:
    pan:
      example: 30
      selector:
        number:
          min: -88
          max: 88
          step: 1
          unit_of_measurement: "°"
    tilt:
      example: 45
      selector:
        number:
          min: -58
          max: 58
          step: 1
          unit_of_measurement: "°"
    duration:
      example: 800
      selector:
        number:
          min: 0
          max: 10000
          step: 50
          unit_of_measurement: ms
save_preset:
  target:
    entity:
      integration: lynx
      domain: camera
  fields:
    name:
      required: true
      example: door
      selector:
        text:
    pan:
      selector:
        number: { min: -88, max: 88, step: 1, unit_of_measurement: "°" }
    tilt:
      selector:
        number: { min: -58, max: 58, step: 1, unit_of_measurement: "°" }
delete_preset:
  target:
    entity:
      integration: lynx
      domain: camera
  fields:
    name:
      required: true
      example: door
      selector:
        text:
